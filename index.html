<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Countdown Timer Online — Tabutility</title>
<meta name="description" content="Free online countdown timer with presets and alarm. Set any time, hit start and get an alert when it's done."/>
<script async src="https://www.googletagmanager.com/gtag/js?id=G-78VZWJ5B1W"></script>
<script>window.dataLayer=window.dataLayer||[];function gtag(){dataLayer.push(arguments);}gtag('js',new Date());gtag('config','G-78VZWJ5B1W');</script>

<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<style>*{box-sizing:border-box;margin:0;padding:0}body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#0f172a;color:#f1f5f9;min-height:100vh}nav{background:#1e293b;border-bottom:1px solid #334155;padding:14px 24px;display:flex;align-items:center;gap:16px}nav a{color:#94a3b8;text-decoration:none;font-size:14px}nav a:hover{color:#f1f5f9}nav .brand{color:#38bdf8;font-weight:700;font-size:18px}.ad-banner{background:#1e293b;border-bottom:1px solid #334155;padding:8px;text-align:center}</style>
</head>
<body>
<nav><span class="brand">⚡ Tabutility</span><a href="https://tabutility.com">← All Tools</a></nav>
<div class="ad-banner"><ins class="adsbygoogle" style="display:block" data-ad-client="ca-pub-7039091592734005" data-ad-slot="auto" data-ad-format="auto" data-full-width-responsive="true"></ins><script>(adsbygoogle=window.adsbygoogle||[]).push({});</script></div>
<div id="root"></div>
<script type="text/babel">
//<![CDATA[
const { useState, useEffect, useRef } = React;

const PRESETS = [
  { label: '1 min', s: 60 }, { label: '2 min', s: 120 }, { label: '3 min', s: 180 },
  { label: '5 min', s: 300 }, { label: '10 min', s: 600 }, { label: '15 min', s: 900 },
  { label: '20 min', s: 1200 }, { label: '25 min', s: 1500 }, { label: '30 min', s: 1800 },
  { label: '45 min', s: 2700 }, { label: '1 hr', s: 3600 }, { label: '2 hr', s: 7200 },
];

function playAlarm(ctx) {
  for (let i = 0; i < 3; i++) {
    const o = ctx.createOscillator();
    const g = ctx.createGain();
    o.connect(g); g.connect(ctx.destination);
    o.frequency.value = 880;
    g.gain.setValueAtTime(0.5, ctx.currentTime + i * 0.4);
    g.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + i * 0.4 + 0.3);
    o.start(ctx.currentTime + i * 0.4);
    o.stop(ctx.currentTime + i * 0.4 + 0.3);
  }
}

export default function CountdownTimer() {
  const [total, setTotal] = useState(300);
  const [remaining, setRemaining] = useState(300);
  const [running, setRunning] = useState(false);
  const [done, setDone] = useState(false);
  const [hInput, setHInput] = useState('0');
  const [mInput, setMInput] = useState('5');
  const [sInput, setSInput] = useState('0');
  const intervalRef = useRef(null);
  const audioRef = useRef(null);

  const getAudio = () => {
    if (!audioRef.current) audioRef.current = new AudioContext();
    return audioRef.current;
  };

  useEffect(() => {
    if (running && remaining > 0) {
      intervalRef.current = setInterval(() => {
        setRemaining(r => {
          if (r <= 1) {
            clearInterval(intervalRef.current);
            setRunning(false);
            setDone(true);
            try { playAlarm(getAudio()); } catch(e) {}
            return 0;
          }
          return r - 1;
        });
      }, 1000);
    }
    return () => clearInterval(intervalRef.current);
  }, [running]);

  const applyCustom = () => {
    const t = (parseInt(hInput)||0)*3600 + (parseInt(mInput)||0)*60 + (parseInt(sInput)||0);
    if (t > 0) { setTotal(t); setRemaining(t); setRunning(false); setDone(false); }
  };

  const applyPreset = (s) => { setTotal(s); setRemaining(s); setRunning(false); setDone(false); setHInput('0'); setMInput(String(Math.floor(s/60))); setSInput(String(s%60)); };

  const start = () => { if (remaining > 0) { setDone(false); setRunning(true); } };
  const pause = () => { clearInterval(intervalRef.current); setRunning(false); };
  const reset = () => { clearInterval(intervalRef.current); setRunning(false); setRemaining(total); setDone(false); };

  const h = Math.floor(remaining / 3600);
  const m = Math.floor((remaining % 3600) / 60);
  const s = remaining % 60;
  const pct = total > 0 ? ((total - remaining) / total) * 100 : 0;
  const r = 120; const circ = 2 * Math.PI * r;

  return (
    <div style={{maxWidth:600,margin:'40px auto',padding:'0 20px'}}>
      <h1 style={{textAlign:'center',fontSize:28,fontWeight:700,marginBottom:8}}>Countdown Timer</h1>
      <p style={{textAlign:'center',color:'#94a3b8',marginBottom:32}}>Set a time, hit start, get an alarm when it's done</p>

      <div style={{display:'flex',gap:8,flexWrap:'wrap',justifyContent:'center',marginBottom:24}}>
        {PRESETS.map(p => (
          <button key={p.s} onClick={() => applyPreset(p.s)} style={{background:total===p.s&&remaining===p.s?'#38bdf8':'#1e293b',color:total===p.s&&remaining===p.s?'#0f172a':'#94a3b8',border:'1px solid #334155',borderRadius:8,padding:'8px 14px',fontSize:14,cursor:'pointer',fontWeight:600}}>{p.label}</button>
        ))}
      </div>

      <div style={{background:'#1e293b',borderRadius:20,padding:'32px 24px',textAlign:'center',border:'1px solid #334155',marginBottom:24}}>
        <svg width="280" height="280" style={{display:'block',margin:'0 auto 24px'}}>
          <circle cx="140" cy="140" r={r} fill="none" stroke="#334155" strokeWidth="10"/>
          <circle cx="140" cy="140" r={r} fill="none" stroke={done?'#ef4444':running?'#38bdf8':'#64748b'} strokeWidth="10"
            strokeDasharray={circ} strokeDashoffset={circ - (circ * pct / 100)}
            strokeLinecap="round" transform="rotate(-90 140 140)" style={{transition:'stroke-dashoffset 0.9s linear'}}/>
          <text x="140" y="128" textAnchor="middle" fill="#f1f5f9" fontSize="52" fontFamily="monospace" fontWeight="300">
            {`${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}`}
          </text>
          <text x="140" y="170" textAnchor="middle" fill="#94a3b8" fontSize="28" fontFamily="monospace">
            {String(s).padStart(2,'0')}
          </text>
          {done && <text x="140" y="200" textAnchor="middle" fill="#ef4444" fontSize="18" fontWeight="700">TIME'S UP!</text>}
        </svg>

        <div style={{display:'flex',gap:8,justifyContent:'center',flexWrap:'wrap',marginBottom:20}}>
          <div style={{display:'flex',gap:4,alignItems:'center'}}>
            <input value={hInput} onChange={e=>setHInput(e.target.value)} style={{width:56,background:'#0f172a',color:'#f1f5f9',border:'1px solid #334155',borderRadius:8,padding:'8px',textAlign:'center',fontSize:16}} placeholder="h"/>
            <span style={{color:'#64748b'}}>h</span>
            <input value={mInput} onChange={e=>setMInput(e.target.value)} style={{width:56,background:'#0f172a',color:'#f1f5f9',border:'1px solid #334155',borderRadius:8,padding:'8px',textAlign:'center',fontSize:16}} placeholder="m"/>
            <span style={{color:'#64748b'}}>m</span>
            <input value={sInput} onChange={e=>setSInput(e.target.value)} style={{width:56,background:'#0f172a',color:'#f1f5f9',border:'1px solid #334155',borderRadius:8,padding:'8px',textAlign:'center',fontSize:16}} placeholder="s"/>
            <span style={{color:'#64748b'}}>s</span>
            <button onClick={applyCustom} style={{background:'#334155',color:'#f1f5f9',border:'none',borderRadius:8,padding:'8px 14px',fontSize:14,cursor:'pointer',fontWeight:600}}>Set</button>
          </div>
        </div>

        <div style={{display:'flex',gap:12,justifyContent:'center'}}>
          {!running && !done && <button onClick={start} style={{background:'#38bdf8',color:'#0f172a',border:'none',borderRadius:12,padding:'14px 36px',fontSize:18,fontWeight:700,cursor:'pointer'}}>{remaining < total ? 'Resume' : 'Start'}</button>}
          {running && <button onClick={pause} style={{background:'#f59e0b',color:'#0f172a',border:'none',borderRadius:12,padding:'14px 36px',fontSize:18,fontWeight:700,cursor:'pointer'}}>Pause</button>}
          <button onClick={reset} style={{background:'#1e293b',color:'#94a3b8',border:'1px solid #334155',borderRadius:12,padding:'14px 36px',fontSize:18,fontWeight:700,cursor:'pointer'}}>Reset</button>
        </div>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<CountdownTimer />);
//]]>
</script>
</body>
</html>
