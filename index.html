<!DOCTYPE html>
<html lang="en">
<head>

<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Countdown Timer Online — Tabutility</title>
<meta name="description" content="Free online countdown timer with presets and alarm. Set any time, hit start and get an alert when it's done."/>

<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#0f172a;color:#f1f5f9;min-height:100vh}
nav{background:#1e293b;border-bottom:1px solid #334155;padding:14px 24px;display:flex;align-items:center;gap:16px}
nav a{color:#94a3b8;text-decoration:none;font-size:14px}nav a:hover{color:#f1f5f9}
nav .brand{color:#38bdf8;font-weight:700;font-size:18px}
.ad-banner{background:#1e293b;border-bottom:1px solid #334155;padding:8px;text-align:center}
#app{max-width:560px;margin:40px auto;padding:0 20px}
h1{font-size:28px;font-weight:700;text-align:center;margin-bottom:8px}
.subtitle{text-align:center;color:#94a3b8;margin-bottom:28px}
.presets{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-bottom:24px}
.preset{border-radius:8px;padding:8px 14px;font-size:14px;font-weight:600;cursor:pointer;border:1px solid #334155;background:#1e293b;color:#94a3b8;transition:background .15s,color .15s}
.preset.active{background:#38bdf8;color:#0f172a;border-color:#38bdf8}
.card{background:#1e293b;border-radius:20px;padding:32px 24px;text-align:center;border:1px solid #334155;margin-bottom:20px}
#ring-svg{display:block;margin:0 auto 24px}
.custom-row{display:flex;gap:6px;justify-content:center;align-items:center;margin-bottom:20px;flex-wrap:wrap}
.custom-row input{width:58px;background:#0f172a;color:#f1f5f9;border:1px solid #334155;border-radius:8px;padding:8px;text-align:center;font-size:16px}
.custom-row span{color:#64748b;font-size:14px}
.set-btn{background:#334155;color:#f1f5f9;border:none;border-radius:8px;padding:8px 14px;font-size:14px;font-weight:600;cursor:pointer}
.btns{display:flex;gap:12px;justify-content:center}
.btn{border:none;border-radius:12px;padding:14px 36px;font-size:17px;font-weight:700;cursor:pointer}
.btn-start{background:#38bdf8;color:#0f172a}
.btn-pause{background:#f59e0b;color:#0f172a}
.btn-reset{background:#1e293b;color:#94a3b8;border:1px solid #334155!important}
</style>
</head>
<body>
<nav><span class="brand">⚡ Tabutility</span><a href="https://tabutility.com">← All Tools</a></nav>
<div class="ad-banner"><ins class="adsbygoogle" style="display:block" data-ad-client="ca-pub-7039091592734005" data-ad-slot="auto" data-ad-format="auto" data-full-width-responsive="true"></ins><script>(adsbygoogle=window.adsbygoogle||[]).push({});</script></div>
<div id="app">
  <h1>Countdown Timer</h1>
  <p class="subtitle">Set a time, hit start, get an alarm when it's done</p>
  <div class="presets" id="presets"></div>
  <div class="card">
    <svg id="ring-svg" width="260" height="260" viewBox="0 0 260 260">
      <circle cx="130" cy="130" r="110" fill="none" stroke="#334155" stroke-width="10"/>
      <circle id="ring" cx="130" cy="130" r="110" fill="none" stroke="#38bdf8" stroke-width="10"
        stroke-linecap="round" transform="rotate(-90 130 130)"
        stroke-dasharray="691.15" stroke-dashoffset="0"/>
      <text id="time-hm" x="130" y="118" text-anchor="middle" fill="#f1f5f9" font-size="52" font-family="monospace" font-weight="300">00:05</text>
      <text id="time-s"  x="130" y="158" text-anchor="middle" fill="#94a3b8" font-size="28" font-family="monospace">00</text>
      <text id="done-txt" x="130" y="190" text-anchor="middle" fill="#ef4444" font-size="17" font-weight="700" visibility="hidden">TIME'S UP!</text>
    </svg>
    <div class="custom-row">
      <input id="inp-h" type="number" min="0" value="0" placeholder="h"/>
      <span>h</span>
      <input id="inp-m" type="number" min="0" max="59" value="5" placeholder="m"/>
      <span>m</span>
      <input id="inp-s" type="number" min="0" max="59" value="0" placeholder="s"/>
      <span>s</span>
      <button class="set-btn" onclick="applyCustom()">Set</button>
    </div>
    <div class="btns" id="btns"></div>
  </div>
</div>
<script>
var PRESETS = [60,120,180,300,600,900,1200,1500,1800,2700,3600,7200];
var PRESET_LABELS = ['1 min','2 min','3 min','5 min','10 min','15 min','20 min','25 min','30 min','45 min','1 hr','2 hr'];
var total = 300;
var remaining = 300;
var running = false;
var intervalId = null;
var audioCtx = null;
var CIRC = 2 * Math.PI * 110;

var ring = document.getElementById('ring');
var timeHm = document.getElementById('time-hm');
var timeS = document.getElementById('time-s');
var doneTxt = document.getElementById('done-txt');
var btnsEl = document.getElementById('btns');
var presetsEl = document.getElementById('presets');

function pad2(n){ return String(n).padStart(2,'0'); }

function getCtx() {
  if (!audioCtx) audioCtx = new AudioContext();
  return audioCtx;
}
function playAlarm() {
  try {
    var ctx = getCtx();
    for (var i=0; i<3; i++) {
      var o = ctx.createOscillator();
      var g = ctx.createGain();
      o.connect(g); g.connect(ctx.destination);
      o.frequency.value = 880;
      g.gain.setValueAtTime(0.5, ctx.currentTime + i*0.4);
      g.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + i*0.4 + 0.3);
      o.start(ctx.currentTime + i*0.4);
      o.stop(ctx.currentTime + i*0.4 + 0.3);
    }
  } catch(e){}
}

function updateDisplay() {
  var h = Math.floor(remaining/3600);
  var m = Math.floor((remaining%3600)/60);
  var s = remaining%60;
  timeHm.textContent = (h>0 ? pad2(h)+':' : '') + pad2(m);
  timeS.textContent = pad2(s);
  var pct = total > 0 ? (total - remaining) / total : 0;
  ring.setAttribute('stroke-dashoffset', String(CIRC * pct));
  ring.setAttribute('stroke', remaining === 0 ? '#ef4444' : (running ? '#38bdf8' : '#64748b'));
}

function renderBtns() {
  btnsEl.innerHTML = '';
  if (!running) {
    var s = document.createElement('button');
    s.className = 'btn btn-start';
    s.textContent = remaining < total && remaining > 0 ? 'Resume' : 'Start';
    s.onclick = startTimer;
    btnsEl.appendChild(s);
  } else {
    var p = document.createElement('button');
    p.className = 'btn btn-pause';
    p.textContent = 'Pause';
    p.onclick = pauseTimer;
    btnsEl.appendChild(p);
  }
  var r = document.createElement('button');
  r.className = 'btn btn-reset';
  r.textContent = 'Reset';
  r.onclick = resetTimer;
  btnsEl.appendChild(r);
}

function startTimer() {
  if (remaining <= 0) return;
  doneTxt.setAttribute('visibility','hidden');
  running = true;
  intervalId = setInterval(function() {
    remaining--;
    updateDisplay();
    if (remaining <= 0) {
      clearInterval(intervalId);
      running = false;
      doneTxt.setAttribute('visibility','visible');
      playAlarm();
      renderBtns();
    }
  }, 1000);
  renderBtns();
}
function pauseTimer() {
  clearInterval(intervalId);
  running = false;
  renderBtns();
}
function resetTimer() {
  clearInterval(intervalId);
  running = false;
  remaining = total;
  doneTxt.setAttribute('visibility','hidden');
  updateDisplay();
  renderBtns();
}
function setTime(secs) {
  clearInterval(intervalId);
  running = false;
  total = secs;
  remaining = secs;
  doneTxt.setAttribute('visibility','hidden');
  document.getElementById('inp-h').value = Math.floor(secs/3600);
  document.getElementById('inp-m').value = Math.floor((secs%3600)/60);
  document.getElementById('inp-s').value = secs%60;
  updateDisplay();
  renderBtns();
  renderPresets(secs);
}
function applyCustom() {
  var h = parseInt(document.getElementById('inp-h').value)||0;
  var m = parseInt(document.getElementById('inp-m').value)||0;
  var s = parseInt(document.getElementById('inp-s').value)||0;
  var t = h*3600+m*60+s;
  if (t > 0) setTime(t);
}
function renderPresets(active) {
  presetsEl.innerHTML = '';
  PRESETS.forEach(function(secs, i) {
    var b = document.createElement('button');
    b.className = 'preset' + (secs === active ? ' active' : '');
    b.textContent = PRESET_LABELS[i];
    b.onclick = function(){ setTime(secs); };
    presetsEl.appendChild(b);
  });
}

renderPresets(300);
updateDisplay();
renderBtns();
</script>
</body>
</html>
